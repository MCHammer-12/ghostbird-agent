# Supabase project config for this repo.
# Fork owners connect this repo to their Supabase project via the GitHub integration
# in the Supabase dashboard. See docs/DATABASE.md.

project_id = "ghostbird-agent"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.migrations]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
enable_confirmations = false

# Optional: pin a production project for Supabase Branching remotes (Pro plan).
# Replace the project_id after you create your Supabase project.
#
# [remotes.production]
# project_id = "your-supabase-project-ref"
