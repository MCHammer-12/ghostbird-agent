# FastAPI Cloud deployment configuration
# https://fastapicloud.com/docs/getting-started/existing-project/

[project]
name = "fastapi-cloud-base-template"
entrypoint = "app.main:app"

[deploy]
healthcheck_path = "/health"
port = 8000

# Set these secrets in FastAPI Cloud (fastapi cloud env set --secret):
# API_KEY
# OPENAI_API_KEY / ANTHROPIC_API_KEY / GOOGLE_AI_API_KEY
# SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY
# STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET
# GOOGLE_SERVICE_ACCOUNT_JSON
# APIFY_API_TOKEN
# HUBSPOT_API_KEY / PIPEDRIVE_API_TOKEN
# RESEND_API_KEY / SENDGRID_API_KEY
# WEBHOOK_SECRET (optional, for generic inbound webhooks)
